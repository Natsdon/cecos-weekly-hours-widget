<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CECOS Weekly Hours</title>
  <script src="https://js.jotform.com/JotFormCustomWidget.min.js"></script>
  <style>
    :root { --brand:#6f1738; --brand2:#981f4f; --ink:#18202b; --muted:#667085; --line:#d9dee8; --soft:#f6f7f9; --good:#087a55; --bad:#b42318; --warn:#9a6700; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:#fff; font:14px/1.45 Inter,Arial,sans-serif; }
    button,input,select,textarea { font:inherit; }
    .app { max-width:1120px; margin:auto; padding:8px 4px 28px; }
    .intro { padding:18px; border:1px solid var(--line); border-radius:14px; background:linear-gradient(135deg,#fff,#fbf5f7); }
    h2 { margin:0 0 5px; font-size:22px; }
    .hint,.muted { color:var(--muted); }
    .period { display:grid; grid-template-columns:1fr 1fr auto; gap:12px; align-items:end; margin-top:16px; }
    label { display:block; font-weight:650; }
    label span { display:block; margin-bottom:5px; }
    input,select,textarea { width:100%; min-height:40px; border:1px solid #bcc4d1; border-radius:8px; padding:8px 10px; background:#fff; color:var(--ink); }
    input:focus,select:focus,textarea:focus { outline:3px solid rgba(111,23,56,.14); border-color:var(--brand); }
    .primary,.secondary,.danger,.linkbtn { border:0; border-radius:8px; min-height:40px; padding:9px 14px; cursor:pointer; font-weight:700; }
    .primary { color:#fff; background:var(--brand); }
    .primary:hover { background:var(--brand2); }
    .secondary { color:var(--brand); background:#f8edf1; }
    .danger { color:var(--bad); background:#fff0ee; }
    .linkbtn { min-height:auto; padding:4px 7px; color:var(--brand); background:transparent; }
    .toolbar { display:flex; justify-content:space-between; gap:10px; align-items:center; margin:18px 2px 10px; }
    .toolbar-actions { display:flex; gap:8px; flex-wrap:wrap; }
    .week-list { display:grid; gap:10px; }
    .week { border:1px solid var(--line); border-radius:12px; overflow:hidden; background:#fff; box-shadow:0 1px 2px rgba(16,24,40,.04); }
    .week.over { border:2px solid var(--bad); }
    .week.zero { border-color:#e6c764; }
    .week-head { display:grid; grid-template-columns:minmax(175px,1fr) minmax(160px,220px) auto; align-items:center; gap:12px; padding:12px 14px; background:var(--soft); cursor:pointer; }
    .week-title { display:flex; align-items:center; gap:9px; font-weight:800; }
    .chev { display:inline-block; transition:transform .18s; }
    .week.open .chev { transform:rotate(90deg); }
    .week-total { justify-self:end; white-space:nowrap; border-radius:999px; padding:5px 10px; background:#e8f5ef; color:var(--good); font-weight:800; }
    .week.over .week-total { color:#fff; background:var(--bad); }
    .week.zero .week-total { color:var(--warn); background:#fff6d8; }
    .week-body { display:none; padding:14px; }
    .week.open .week-body { display:block; }
    .grid-head,.allocation { display:grid; grid-template-columns:1.1fr 1.7fr .58fr .58fr 42px; gap:8px; align-items:center; }
    .grid-head { padding:0 2px 5px; color:var(--muted); font-size:12px; font-weight:800; }
    .allocation { margin-bottom:8px; }
    .hours { text-align:center; }
    .week-actions { display:flex; gap:8px; flex-wrap:wrap; margin:9px 0 14px; }
    .extras { display:grid; grid-template-columns:180px 1fr; gap:12px; padding-top:13px; border-top:1px solid var(--line); }
    .error { margin-top:9px; color:var(--bad); font-weight:750; }
    .summary { margin-top:20px; border:1px solid var(--line); border-radius:12px; overflow:hidden; }
    .summary h3 { margin:0; padding:13px 15px; background:var(--brand); color:#fff; }
    .table-wrap { overflow:auto; }
    table { width:100%; border-collapse:collapse; }
    th,td { padding:9px 11px; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap; }
    th { background:var(--soft); font-size:12px; }
    td.num,th.num { text-align:right; }
    tfoot td { font-weight:850; background:#fbf6f8; }
    .review { display:none; margin-top:14px; padding:12px; border:1px solid #e6c764; border-radius:10px; background:#fffbea; }
    .review label { display:flex; align-items:flex-start; gap:8px; }
    .review input { width:auto; min-height:auto; margin-top:3px; }
    .global-error { display:none; margin-top:12px; padding:12px; border-radius:9px; background:#fff0ee; color:var(--bad); font-weight:800; }
    @media(max-width:760px){
      .period { grid-template-columns:1fr; }
      .week-head { grid-template-columns:1fr auto; }
      .week-type { grid-column:1/-1; }
      .grid-head { display:none; }
      .allocation { grid-template-columns:1fr 1fr; padding:10px; border:1px solid var(--line); border-radius:9px; }
      .allocation select:nth-child(2) { grid-column:1/-1; }
      .allocation .danger { grid-column:1/-1; }
      .extras { grid-template-columns:1fr; }
    }
  </style>
</head>
<body>
<main class="app">
  <section class="intro">
    <h2>Weekly teaching and administration hours</h2>
    <div class="hint">Choose the term dates. A week will be created for every Monday. Add another allocation only when the course or campus changes.</div>
    <div class="period">
      <label><span>Term start date</span><input id="startDate" type="date"></label>
      <label><span>Term end date</span><input id="endDate" type="date"></label>
      <button class="primary" id="generate" type="button">Generate weeks</button>
    </div>
    <div id="dateError" class="error" role="alert"></div>
  </section>

  <section id="workspace" hidden>
    <div class="toolbar">
      <div><strong id="weekCount"></strong><div class="muted">Maximum 40 hours per week; lower totals are allowed.</div></div>
      <div class="toolbar-actions"><button class="secondary" id="expandAll" type="button">Expand all</button><button class="secondary" id="collapseAll" type="button">Collapse all</button></div>
    </div>
    <div id="weeks" class="week-list"></div>
    <section class="summary">
      <h3>Term summary</h3>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Week commencing</th><th>Week type</th><th class="num">Teaching</th><th class="num">Admin</th><th class="num">Leave/other</th><th class="num">Total</th></tr></thead>
          <tbody id="summaryBody"></tbody>
          <tfoot id="summaryFoot"></tfoot>
        </table>
      </div>
    </section>
    <div id="zeroReview" class="review">
      <label><input id="zeroAcknowledged" type="checkbox"><span>I have reviewed the zero-hour weeks and confirm they are correct.</span></label>
    </div>
    <div id="globalError" class="global-error" role="alert"></div>
  </section>
</main>

<template id="weekTemplate">
  <article class="week open">
    <header class="week-head">
      <div class="week-title"><span class="chev">▶</span><span class="week-label"></span></div>
      <select class="week-type" aria-label="Week type">
        <option>Teaching week</option><option>Reading week</option><option>Term break</option><option>College closed</option><option>Holiday</option><option>Other</option>
      </select>
      <div class="week-total">0 / 40 hours</div>
    </header>
    <div class="week-body">
      <div class="grid-head"><span>Campus</span><span>Course</span><span>Teaching</span><span>Admin</span><span></span></div>
      <div class="allocations"></div>
      <div class="week-actions"><button class="secondary add-row" type="button">+ Add course/campus</button><button class="secondary copy-prev" type="button">Copy previous week</button></div>
      <div class="extras">
        <label><span>Leave/closure/other hours</span><input class="other-hours hours" type="number" min="0" max="40" step="0.5" value="0"></label>
        <label><span>Comment</span><input class="comment" type="text" maxlength="300" placeholder="Optional explanation"></label>
      </div>
      <div class="error week-error" role="alert"></div>
    </div>
  </article>
</template>

<template id="rowTemplate">
  <div class="allocation">
    <select class="campus" aria-label="Campus"></select>
    <select class="course" aria-label="Course"></select>
    <input class="teaching hours" aria-label="Teaching hours" type="number" min="0" max="40" step="0.5" value="0">
    <input class="admin hours" aria-label="Administration hours" type="number" min="0" max="40" step="0.5" value="0">
    <button class="danger remove-row" type="button" aria-label="Remove allocation">×</button>
  </div>
</template>

<script>
(() => {
  'use strict';
  const DEFAULT_CAMPUSES = ['London North','London East','Birmingham','Bradford','Leicester','Remote / Central','Other'];
  const DEFAULT_COURSES = ['HND In Business (NHC)','BSc (Hons) Business Management (Top-up) – STF','Foundation Degree in Business and Management','FdA Business with Human Resource Management','BA (Hons) Business Management (Top-up)','BSc (Hons) Health & Social Care with Foundation','BSc-BMF','General / Not course-specific','Other'];
  const MAX_WEEKLY = 40;
  const state = { campuses:DEFAULT_CAMPUSES, courses:DEFAULT_COURSES, weeks:[] };
  const $ = (s,r=document) => r.querySelector(s);
  const $$ = (s,r=document) => [...r.querySelectorAll(s)];
  const iso = d => d.toISOString().slice(0,10);
  const displayDate = s => new Date(s+'T12:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'2-digit',year:'numeric'});
  const num = v => Number.isFinite(parseFloat(v)) ? parseFloat(v) : 0;
  const round = v => Math.round(v*100)/100;
  const parseSetting = (value,fallback) => value && value.trim() ? value.split(/\r?\n|,/).map(x=>x.trim()).filter(Boolean) : fallback;

  function initSettings(){
    if (!window.JFCustomWidget) return;
    try {
      state.campuses = parseSetting(JFCustomWidget.getWidgetSetting('CampusList'), DEFAULT_CAMPUSES);
      state.courses = parseSetting(JFCustomWidget.getWidgetSetting('CourseList'), DEFAULT_COURSES);
    } catch (_) {}
  }

  function optionHtml(items){ return '<option value="">Select…</option>'+items.map(x=>`<option>${escapeHtml(x)}</option>`).join(''); }
  function escapeHtml(v){ return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
  function mondayOnly(value){ const d=new Date(value+'T12:00:00'); return !isNaN(d) && d.getDay()===1; }

  function addRow(week, values={}){
    const row = $('#rowTemplate').content.firstElementChild.cloneNode(true);
    $('.campus',row).innerHTML=optionHtml(state.campuses);
    $('.course',row).innerHTML=optionHtml(state.courses);
    $('.campus',row).value=values.campus||'';
    $('.course',row).value=values.course||'';
    $('.teaching',row).value=values.teaching??0;
    $('.admin',row).value=values.admin??0;
    $('.remove-row',row).addEventListener('click',()=>{ row.remove(); if(!$('.allocation',$('.allocations',week))) addRow(week); recalc(); });
    $$('input,select',row).forEach(el=>el.addEventListener('input',recalc));
    $('.allocations',week).append(row);
  }

  function buildWeeks(){
    const start=$('#startDate').value, end=$('#endDate').value, err=$('#dateError'); err.textContent='';
    if(!start||!end){ err.textContent='Select both the term start and end dates.'; return; }
    if(!mondayOnly(start)||!mondayOnly(end)){ err.textContent='Both dates must be Mondays so each weekly record is consistent.'; return; }
    const s=new Date(start+'T12:00:00'), e=new Date(end+'T12:00:00');
    if(e<s){ err.textContent='The term end date cannot be before the start date.'; return; }
    const dates=[]; for(let d=new Date(s);d<=e;d.setDate(d.getDate()+7)) dates.push(iso(d));
    if(dates.length>54){ err.textContent='The selected period is too long. Use a maximum of 54 weeks.'; return; }
    $('#weeks').innerHTML='';
    dates.forEach((date,i)=>{
      const week=$('#weekTemplate').content.firstElementChild.cloneNode(true); week.dataset.date=date;
      $('.week-label',week).textContent='Week commencing '+displayDate(date);
      $('.week-head',week).addEventListener('click',ev=>{ if(ev.target.closest('select,button,input')) return; week.classList.toggle('open'); resize(); });
      $('.add-row',week).addEventListener('click',()=>{ addRow(week); recalc(); resize(); });
      $('.copy-prev',week).hidden=i===0;
      $('.copy-prev',week).addEventListener('click',()=>copyPrevious(week));
      $$('input,select',week).forEach(el=>el.addEventListener('input',recalc));
      addRow(week);
      $('#weeks').append(week);
    });
    $('#weekCount').textContent=`${dates.length} weeks generated`;
    $('#workspace').hidden=false; recalc(); resize();
  }

  function rowData(row){ return {campus:$('.campus',row).value,course:$('.course',row).value,teaching:round(num($('.teaching',row).value)),admin:round(num($('.admin',row).value))}; }
  function weekData(week){
    const allocations=$$('.allocation',week).map(rowData).filter(r=>r.campus||r.course||r.teaching||r.admin);
    const teaching=round(allocations.reduce((a,r)=>a+r.teaching,0));
    const admin=round(allocations.reduce((a,r)=>a+r.admin,0));
    const other=round(num($('.other-hours',week).value));
    return {week_commencing:week.dataset.date,week_type:$('.week-type',week).value,allocations,teaching_hours:teaching,admin_hours:admin,leave_other_hours:other,total_hours:round(teaching+admin+other),comment:$('.comment',week).value.trim()};
  }

  function validateWeek(data){
    const errors=[];
    if(data.total_hours>MAX_WEEKLY) errors.push(`This week totals ${data.total_hours} hours. Reduce it to 40 or less.`);
    data.allocations.forEach((r,i)=>{
      if((r.teaching||r.admin)&&(!r.campus||!r.course)) errors.push(`Allocation ${i+1}: select both campus and course.`);
      if(r.teaching<0||r.admin<0) errors.push(`Allocation ${i+1}: hours cannot be negative.`);
    });
    if(data.leave_other_hours<0) errors.push('Leave/other hours cannot be negative.');
    return errors;
  }

  function recalc(){
    const weeks=$$('.week'); state.weeks=weeks.map(weekData); let hasZero=false, hasOver=false;
    weeks.forEach((week,i)=>{
      const d=state.weeks[i], errors=validateWeek(d); week.classList.toggle('over',d.total_hours>MAX_WEEKLY); week.classList.toggle('zero',d.total_hours===0);
      $('.week-total',week).textContent=`${d.total_hours} / 40 hours`; $('.week-error',week).textContent=errors.join(' ');
      hasZero ||= d.total_hours===0; hasOver ||= d.total_hours>MAX_WEEKLY;
    });
    $('#zeroReview').style.display=hasZero?'block':'none'; if(!hasZero) $('#zeroAcknowledged').checked=false;
    renderSummary(); $('#globalError').style.display='none';
    sendLiveData(!hasOver && (!hasZero||$('#zeroAcknowledged').checked));
  }

  function renderSummary(){
    $('#summaryBody').innerHTML=state.weeks.map(w=>`<tr><td>${displayDate(w.week_commencing)}</td><td>${escapeHtml(w.week_type)}</td><td class="num">${w.teaching_hours}</td><td class="num">${w.admin_hours}</td><td class="num">${w.leave_other_hours}</td><td class="num"><strong>${w.total_hours}</strong></td></tr>`).join('');
    const totals=state.weeks.reduce((a,w)=>({t:a.t+w.teaching_hours,a:a.a+w.admin_hours,o:a.o+w.leave_other_hours,x:a.x+w.total_hours}),{t:0,a:0,o:0,x:0});
    $('#summaryFoot').innerHTML=`<tr><td colspan="2">Term total</td><td class="num">${round(totals.t)}</td><td class="num">${round(totals.a)}</td><td class="num">${round(totals.o)}</td><td class="num">${round(totals.x)}</td></tr>`;
  }

  function copyPrevious(week){
    const all=$$('.week'), index=all.indexOf(week); if(index<1) return; const prev=weekData(all[index-1]);
    $('.week-type',week).value=prev.week_type; $('.allocations',week).innerHTML=''; prev.allocations.forEach(r=>addRow(week,r)); if(!prev.allocations.length)addRow(week);
    $('.other-hours',week).value=prev.leave_other_hours; $('.comment',week).value=prev.comment; recalc(); resize();
  }

  function payload(){ return {schema_version:'1.0',period:{start_date:$('#startDate').value,end_date:$('#endDate').value,max_weekly_hours:MAX_WEEKLY},weeks:state.weeks}; }
  function isValid(){
    if(!state.weeks.length) return {ok:false,message:'Generate the weekly records before submitting.'};
    const invalid=state.weeks.filter(w=>validateWeek(w).length); if(invalid.length) return {ok:false,message:'One or more weeks exceeds 40 hours or contains an incomplete allocation.'};
    if(state.weeks.some(w=>w.total_hours===0)&&!$('#zeroAcknowledged').checked) return {ok:false,message:'Review the zero-hour weeks and tick the confirmation box.'};
    return {ok:true,message:''};
  }
  function sendLiveData(valid){ if(window.JFCustomWidget){ try{ JFCustomWidget.sendData({valid,value:JSON.stringify(payload())}); }catch(_){} } }
  function resize(){ if(window.JFCustomWidget){ try{ JFCustomWidget.requestFrameResize({height:document.documentElement.scrollHeight+20}); }catch(_){} } }
  function submitToJotform(){
    recalc(); const result=isValid(); $('#globalError').textContent=result.message; $('#globalError').style.display=result.ok?'none':'block';
    if(!result.ok){ const bad=$('.week.over')||$('#zeroReview'); if(bad) bad.scrollIntoView({behavior:'smooth',block:'center'}); }
    JFCustomWidget.sendSubmit({valid:result.ok,value:JSON.stringify(payload())}); resize();
  }

  $('#generate').addEventListener('click',buildWeeks);
  $('#expandAll').addEventListener('click',()=>{$$('.week').forEach(x=>x.classList.add('open'));resize();});
  $('#collapseAll').addEventListener('click',()=>{$$('.week').forEach(x=>x.classList.remove('open'));resize();});
  $('#zeroAcknowledged').addEventListener('change',recalc);
  initSettings();
  if(window.JFCustomWidget){ JFCustomWidget.subscribe('ready',()=>{initSettings();resize();}); JFCustomWidget.subscribe('submit',submitToJotform); }
  window.addEventListener('resize',resize);
})();
</script>
</body>
</html>
